<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Web</title>
    <link href="./dist/output.css" rel="stylesheet">
	<script src="timer-logic.js" defer></script>
</head>
<body class="bg-stone-300 min-h-screen flex flex-col font-inter font-bold">
  <!--nav-->
  <header class="w-full text-lg text-neutral-800">
	<nav class="flex gap-6 p-4 justify-center">
		<a href="#">Settings</a>
		<a href="#">Statistics</a>
		<a href="#">Theme</a>
	</nav>
  </header>
    <main class="flex justify-center items-center flex-1">
	  <section class="border-1 border-neutral-800 p-6 rounded-2xl text-center">
	<!--timer & focus container-->
		<div class="text-neutral-800 m-6 text-2xl">
		  <div id="timer-ring" class="border-8 p-6 border-orange-800 rounded-full w-64 h-64 flex flex-col items-center justify-center">
          	<div id="timer" class="text-5xl my-6"></div>
			   <div class="flex gap-3">
				  <span id="focus">Focus</span>
				  <span id="divider">|</span> 
				  <span id="break" class="text-neutral-800/80 font-light">Break</span>
				</div>
		  	</div>
		</div>
	<!--buttons-->
		<div class="action-buttons flex justify-center gap-6">
        	<button id="start-button" class="cursor-pointer border-2 border-neutral-800 bg-neutral-800 rounded-full text-stone-300 px-6 py-2 hover:bg-stone-300 hover:text-neutral-800 transition">Start</button>
        	<button id="reset-button" class="cursor-pointer border-2 border-neutral-800 rounded-full text-neutral-800 px-6 py-2">Reset</button>
		</div>
	  </section>
    </main>
</body>
</html>
